apiVersion: batch/v1
kind: Job
metadata:
  name: teampulse-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: teampulse-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: teampulse-backend:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/packages/db
          command:
            - bunx
            - prisma
            - migrate
            - deploy
            - --schema
            - prisma/schema.prisma
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teampulse-secrets
                  key: DATABASE_URL