apiVersion: v1
kind: Secret
metadata:
  name: teampulse-secrets
  namespace: teampulse
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: replace-with-a-strong-password
  POSTGRES_DB: teampulse
  DATABASE_URL: "postgresql://postgres:replace-with-a-strong-password@postgres:5432/teampulse?schema=public"
  JWT_SECRET: replace-with-a-long-random-secret
